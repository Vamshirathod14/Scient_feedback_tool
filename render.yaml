services:
  - type: web
    name: scient-feedback-tool
    runtime: node
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20.20.2
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: STUDENT_COMMON_PASSWORD
        sync: false
      - key: CORS_ORIGINS
        sync: false
